server {
  listen 80;
  server_name _;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 21m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 75s;
  }
  location = /sw.js { try_files $uri =404; add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { try_files $uri =404; default_type application/manifest+json; add_header Cache-Control "no-cache"; }
  location = /download/volna-android.apk {
    try_files $uri =404;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="Volna-Android.apk"' always;
    add_header Cache-Control "no-cache" always;
  }
  location = /download/volna-android-version.json {
    try_files $uri =404;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }
  location = /download/volna-windows.exe {
    try_files $uri =404;
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="Volna-Windows-Setup.exe"' always;
    add_header Cache-Control "no-cache" always;
  }
  location = /download/windows/latest.yml { try_files $uri =404; default_type text/yaml; add_header Cache-Control "no-store" always; }
  location /download/windows/ { try_files $uri =404; default_type application/octet-stream; add_header Cache-Control "no-cache" always; }
  location /assets/ { try_files $uri =404; expires 1y; }
  location = / { try_files /landing.html =404; add_header Cache-Control "no-cache"; }
  location = /app/ { return 301 /app; }
  location = /app { try_files /index.html =404; add_header Cache-Control "no-cache"; }
  location ~ "^/([a-zA-Z0-9_]{4,32})/$" { return 308 /$1; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
