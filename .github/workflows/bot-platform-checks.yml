name: Bot platform checks
on:
  push:
    branches: [codex/botfather-management]
  pull_request:
    paths:
      - 'server/**'
      - 'client/**'
      - 'tests/bot*'
      - '.github/workflows/bot-platform-checks.yml'
permissions:
  contents: read
jobs:
  bot-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: volna-ci-test
          POSTGRES_DB: volna_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VOLNA_TEST_DATABASE_URL: postgresql://postgres:volna-ci-test@127.0.0.1:5432/volna_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - name: PostgreSQL 17 client tools
        run: |
          mkdir -p "$RUNNER_TEMP/postgres17/bin" "$RUNNER_TEMP/postgres17/lib"
          docker cp ${{ job.services.postgres.id }}:/usr/lib/postgresql/17/bin/pg_dump "$RUNNER_TEMP/postgres17/bin/pg_dump"
          docker cp ${{ job.services.postgres.id }}:/usr/lib/postgresql/17/bin/pg_restore "$RUNNER_TEMP/postgres17/bin/pg_restore"
          docker cp -L ${{ job.services.postgres.id }}:/usr/lib/x86_64-linux-gnu/libpq.so.5 "$RUNNER_TEMP/postgres17/lib/libpq.so.5"
          echo "$RUNNER_TEMP/postgres17/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/postgres17/lib" >> "$GITHUB_ENV"
      - name: Full PostgreSQL integration suite
        run: npm test
      - name: Web build
        run: npm run build --prefix client
      - name: Install browser
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Browser chat and group permissions
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "./client/node_modules/playwright/index.mjs";console.log(chromium.executablePath())')"
          npm run test:bot-ui
