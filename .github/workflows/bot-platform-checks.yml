name: Bot platform checks
on:
  pull_request:
    paths:
      - 'server/**'
      - 'client/**'
      - 'android-native/**'
      - 'tests/bot*'
      - 'docker/webhook*'
      - 'compose.yaml'
      - 'scripts/test-webhook-egress.sh'
      - '.github/workflows/bot-platform-checks.yml'
permissions:
  contents: read
jobs:
  bot-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: volna-ci-test
          POSTGRES_DB: volna_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VOLNA_TEST_DATABASE_URL: postgresql://postgres:volna-ci-test@127.0.0.1:5432/volna_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - name: PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/volna-pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Full PostgreSQL integration suite
        run: npm test
      - name: Web build
        run: npm run build --prefix client
      - name: Install browser
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Browser chat and group permissions
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "./client/node_modules/playwright/index.mjs";console.log(chromium.executablePath())')"
          npm run test:bot-ui
          node tests/bot-docs-ui.mjs

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_API_URL: https://volna.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare bundled emoji assets
        run: python3 android-native/scripts/prepare-expressions.py --cache "$RUNNER_TEMP/volna-emoji-cache"
      - name: Android tests and APK build
        run: gradle -p android-native --no-daemon testDebugUnitTest assembleDebug

  webhook-egress:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify isolated egress network
        run: sh scripts/test-webhook-egress.sh
