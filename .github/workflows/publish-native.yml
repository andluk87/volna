name: Publish verified native preview
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Volna Native Desktop build run
        required: true
      tag:
        description: Existing native release tag
        required: true
        default: native-v0.1.3
permissions:
  actions: read
  contents: write
concurrency:
  group: native-publish-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify source and build, download and publish
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^native-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          version=${RELEASE_TAG#native-v}
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > build-run.json
          test "$(jq -r .head_sha build-run.json)" = "$(git rev-parse HEAD)"
          test "$(jq -r .conclusion build-run.json)" = success
          test "$(jq -r .name build-run.json)" = 'Volna Native Desktop'
          gh run download "$BUILD_RUN" --name "Volna-Native-$version-windows-x64" --dir release
          cd release
          sha256sum "Volna-Native-Setup-$version.exe" "Volna-Native-$version-windows-x64.zip" "Volna-Native-$version-source.zip" > SHA256SUMS.txt
          cat > notes.md <<NOTES
          Предварительная сборка Volna Desktop Native $version для Windows 10/11 x64.

          Прямое подключение без автоматического прокси используется по умолчанию; системный прокси можно выбрать в настройках. Добавлена проверка сети и диагностика этапов соединения/TLS/HTTP, включая незавершённые запросы. Причина тайм-аутов конкретного компьютера уточняется по результату проверки сети.

          Сетевое исправление: поток SSE изолирован от обычных запросов; безопасные GET повторяются один раз через HTTP/1.1 после временной ошибки. Список чатов автоматически восстанавливается с ограниченной частотой. Диагностика содержит последние операции, время, код HTTP и сетевую ошибку без токенов и содержимого переписки.

          Обновлённый интерфейс: боковая панель папок, аватары, компактные сообщения, растущее поле ввода, эмодзи, поиск по переписке и календарь перехода к дате. Просмотр фотографий с масштабированием и навигацией внутри альбома.

          Нативный интерфейс Qt/C++: вход по QR или коду в служебном чате Волны, чаты, сообщения, файлы, голосовые, аудио- и видеозвонки, трей, день/ночь и защищённый сеанс DPAPI. Qt/WebEngine и Visual C++ Runtime включены в пакет. Приложение устанавливается отдельно от действующей Волны.

          Использованы палитры Telegram Desktop и QR-генератор из его зависимостей. Это самостоятельный клиент протокола Волны, а не полный перенос Telegram Desktop. Звонки используют общий механизм Волны в Qt WebEngine. Управление группами, несколько аккаунтов, стикеры/реакции, расписание, автообновление нативного установщика и демонстрация экрана пока не перенесены. Установщик не подписан цифровой подписью.

          Для звонков нужна страница native-call.html на сервере; если она уже установлена с Native 0.1.0, повторное обновление сервера не требуется. Авторизация совместима с сервером 0.12.112. Команда обновления и ограничения: https://github.com/$GH_REPO/blob/$RELEASE_TAG/UPDATE-NATIVE-$version.md

          Проверки: сборка Windows, запуск упакованного приложения без Qt SDK, DPAPI, HTTPS/QR из упакованного приложения, поиск, галерея, темы, интеграционные сценарии на локальном API, 299 Node-тестов, регрессии существующего интерфейса и сеансов. На Linux проверены реальные аудио- и видеозвонки через coturn, RTP и кадры, обновление сеанса без разрыва, сворачивание, завершение и голосовые. Эти звонки используют тестовые устройства Chromium; физические устройства и переключение сетей Windows требуют проверки на компьютере.

          Файлы: установщик x64, portable ZIP (распаковать целиком и запустить VolnaDesktop.exe), соответствующие исходники и SHA256SUMS.txt. Новый клиент GPL-3.0-or-later; QR — MIT; лицензии Qt включены.
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json 2>/dev/null; then
            test "$(jq -r .isDraft existing.json)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --latest=false --title "Volna Desktop Native $version — Windows preview" --notes-file notes.md
          fi
          verify_asset() {
            gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release-state.json || return 1
            python3 - "$1" <<'PYVERIFY'
          import hashlib, json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          release = json.loads(pathlib.Path('release-state.json').read_text())
          asset = next((row for row in release['assets'] if row['name'] == path.name), {})
          expected = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
          sys.exit(0 if asset.get('state') == 'uploaded' and asset.get('size') == path.stat().st_size and asset.get('digest') == expected else 1)
          PYVERIFY
          }
          for asset in "Volna-Native-Setup-$version.exe" "Volna-Native-$version-windows-x64.zip" "Volna-Native-$version-source.zip" SHA256SUMS.txt; do
            if verify_asset "$asset"; then continue; fi
            uploaded=0
            for attempt in 1 2 3; do
              if timeout 180 gh release upload "$RELEASE_TAG" --clobber "$asset" && verify_asset "$asset"; then
                uploaded=1
                break
              fi
              sleep 2
            done
            test "$uploaded" = 1
          done
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --title "Volna Desktop Native $version — Windows preview" --notes-file notes.md
