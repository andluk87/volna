openapi: 3.1.0
info:
  title: Messenger Bot API (reference contract)
  version: 1.0.0-draft
  description: >-
    Reference OpenAPI contract for the Bot Platform MVP.
    Not a drop-in clone of Telegram Bot API. Endpoint signatures,
    limits and auth must be approved with the messenger backend team.
servers:
  - url: https://api.example.com/bot/v1
security:
  - BotBearer: []
tags:
  - name: Bot
  - name: Messages
  - name: Updates
  - name: Interactions
  - name: Media
paths:
  /me:
    get:
      tags: [Bot]
      summary: Read the bot identity
      operationId: getMe
      responses:
        '200':
          description: Bot identity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotInfo'}
        '401': {$ref: '#/components/responses/ApiError'}

  /messages:
    post:
      tags: [Messages]
      summary: Create a text or media message in an authorized chat
      operationId: createMessage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageCreate'}
      responses:
        '201':
          description: Persisted and accepted for dispatch; not delivered/read proof
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResult'}
        '400': {$ref: '#/components/responses/ApiError'}
        '401': {$ref: '#/components/responses/ApiError'}
        '403': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /messages/{message_id}:
    parameters:
      - name: message_id
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: [Messages]
      summary: Edit a message authored by this bot
      operationId: updateMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessagePatch'}
      responses:
        '200':
          description: Updated message state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResult'}
        '403': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
    delete:
      tags: [Messages]
      summary: Delete a message authored by this bot
      operationId: deleteMessage
      responses:
        '204': {description: Deleted or already removed}
        '403': {$ref: '#/components/responses/ApiError'}

  /commands:
    get:
      tags: [Bot]
      summary: Get registered slash commands
      operationId: getCommands
      responses:
        '200':
          description: Command list
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands:
                    type: array
                    items: {$ref: '#/components/schemas/Command'}
    put:
      tags: [Bot]
      summary: Replace registered commands
      operationId: putCommands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commands]
              properties:
                commands:
                  type: array
                  maxItems: 100
                  items: {$ref: '#/components/schemas/Command'}
      responses:
        '204': {description: Replaced}
        '400': {$ref: '#/components/responses/ApiError'}

  /delivery/webhook:
    put:
      tags: [Updates]
      summary: Enable webhook delivery and disable polling atomically
      operationId: setWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, event_types]
              properties:
                url: {type: string, format: uri, pattern: '^https://'}
                event_types:
                  type: array
                  uniqueItems: true
                  items: {type: string}
      responses:
        '204': {description: Webhook configured}
        '400': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
    delete:
      tags: [Updates]
      summary: Disable the active webhook
      operationId: deleteWebhook
      responses:
        '204': {description: Webhook disabled}

  /updates:
    get:
      tags: [Updates]
      summary: Poll bot updates, mutually exclusive with webhook/hosted mode
      operationId: pollUpdates
      parameters:
        - name: offset
          in: query
          schema: {type: integer, format: int64, minimum: 1}
          description: First requested update ID; confirms all prior IDs.
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
        - name: timeout
          in: query
          schema: {type: integer, minimum: 0, maximum: 30, default: 30}
      responses:
        '200':
          description: Updates ordered by update_id
          content:
            application/json:
              schema:
                type: object
                required: [updates]
                properties:
                  updates:
                    type: array
                    items: {$ref: '#/components/schemas/BotUpdate'}
        '409': {$ref: '#/components/responses/ApiError'}

  /callbacks/{callback_id}/answer:
    parameters:
      - name: callback_id
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [Interactions]
      summary: Acknowledge an inline-button interaction
      operationId: answerCallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text: {type: string, maxLength: 200}
                show_alert: {type: boolean, default: false}
      responses:
        '204': {description: Interaction answered}
        '403': {$ref: '#/components/responses/ApiError'}
        '404': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}

  /chats/{chat_id}:
    parameters:
      - name: chat_id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Bot]
      summary: Read the accessible chat and the bot's effective permissions
      operationId: getChat
      responses:
        '200':
          description: Chat info
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatInfo'}
        '403': {$ref: '#/components/responses/ApiError'}

  /files/uploads:
    post:
      tags: [Media]
      summary: Initialize a direct-to-object-storage upload
      operationId: createFileUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_type, size_bytes]
              properties:
                filename: {type: string, maxLength: 255}
                content_type: {type: string}
                size_bytes: {type: integer, minimum: 1}
      responses:
        '201':
          description: A short-lived upload URL and provisional file ID
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
        '413': {$ref: '#/components/responses/ApiError'}

  /files/{file_id}/complete:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [Media]
      summary: Finalize an upload and enqueue validation
      operationId: completeFileUpload
      responses:
        '202':
          description: Media validation started
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileInfo'}
        '404': {$ref: '#/components/responses/ApiError'}

  /files/{file_id}:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Media]
      summary: Read authorized file metadata and state
      operationId: getFile
      responses:
        '200':
          description: File state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileInfo'}
        '403': {$ref: '#/components/responses/ApiError'}

components:
  securitySchemes:
    BotBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque bot API token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
      description: Dedupe scope is bot ID, HTTP method, resource and key for >=24h.
  responses:
    ApiError:
      description: API error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    RateLimited:
      description: Rate-limited API operation
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    BotInfo:
      type: object
      required: [id, username, display_name, status]
      properties:
        id: {type: string}
        username: {type: string}
        display_name: {type: string}
        status: {type: string, enum: [active, suspended, deleted]}
    ChatInfo:
      type: object
      required: [id, type, encryption_mode, effective_permissions]
      properties:
        id: {type: string}
        type: {type: string, enum: [private, group]}
        encryption_mode: {type: string, enum: [server_readable, e2ee]}
        effective_permissions:
          type: object
          additionalProperties: {type: boolean}
    InlineButton:
      type: object
      additionalProperties: false
      required: [text, callback_data]
      properties:
        text: {type: string, maxLength: 64}
        callback_data: {type: string, maxLength: 128, description: Limit 128 bytes UTF-8, not code points}
    MessageCreate:
      type: object
      additionalProperties: false
      required: [chat_id, type]
      properties:
        chat_id: {type: string}
        type: {type: string, enum: [text, image, document]}
        text: {type: string, maxLength: 4096}
        file_id: {type: string}
        caption: {type: string, maxLength: 1024}
        reply_to_message_id: {type: [string, 'null']}
        reply_markup:
          type: object
          additionalProperties: false
          properties:
            inline_keyboard:
              type: array
              maxItems: 8
              items:
                type: array
                maxItems: 8
                items: {$ref: '#/components/schemas/InlineButton'}
      description: >-
        Conditional validation: type=text requires text;
        type=image|document requires file_id in ready state.
    MessagePatch:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: {type: integer, minimum: 0}
        text: {type: string, maxLength: 4096}
        caption: {type: string, maxLength: 1024}
    MessageResult:
      type: object
      required: [id, chat_id, sender_id, status, created_at]
      properties:
        id: {type: string}
        chat_id: {type: string}
        sender_id: {type: string}
        status: {type: string, enum: [accepted]}
        revision: {type: integer}
        created_at: {type: string, format: date-time}
    Command:
      type: object
      additionalProperties: false
      required: [command, description]
      properties:
        command: {type: string, pattern: '^[a-z0-9_]{1,32}$'}
        description: {type: string, maxLength: 256}
    BotUpdate:
      type: object
      required: [update_id, event_id, event_type, api_version, bot_id, occurred_at, data]
      properties:
        update_id: {type: integer, format: int64, minimum: 1}
        event_id: {type: string}
        event_type: {type: string}
        api_version: {type: string, const: '1'}
        bot_id: {type: string}
        occurred_at: {type: string, format: date-time}
        chat_id: {type: string}
        chat_sequence: {type: integer, format: int64}
        data: {type: object, additionalProperties: true}
    UploadSession:
      type: object
      required: [upload_id, file_id, upload_url, expires_at]
      properties:
        upload_id: {type: string}
        file_id: {type: string}
        upload_url: {type: string, format: uri}
        expires_at: {type: string, format: date-time}
    FileInfo:
      type: object
      required: [file_id, status]
      properties:
        file_id: {type: string}
        status: {type: string, enum: [pending, uploaded, scanning, ready, rejected, expired]}
        size_bytes: {type: integer}
        content_type: {type: string}
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
            retryable: {type: boolean}
